mqtt:
  enabled: true
  host: mosquitto
  port: 1883
detectors:
  cpu1:
    type: cpu
    num_threads: 3
objects:
  track:
  - person
  - car
  - cat
  - dog
  filters:
    person:
      min_area: 2000
      min_score: 0.6
      threshold: 0.7
record:
  enabled: true
  alerts:
    retain:
      days: 14
  detections:
    retain:
      days: 14
  continuous:
    days: 0
  motion:
    days: 7
snapshots:
  enabled: true
  timestamp: true
  bounding_box: true
  retain:
    default: 14
cameras:
  cam_192_168_0_100:
    ffmpeg:
      inputs:
      - path: rtsp://192.168.0.100:8080/h264_ulaw.sdp
        roles:
        - detect
        - record
        input_args: -rtsp_transport tcp -fflags +genpts+discardcorrupt -avoid_negative_ts
          make_zero
    detect:
      enabled: true
      width: 1280
      height: 720
      fps: 15
  cam_192_168_0_177:
    ffmpeg:
      inputs:
      - path: rtsp://192.168.0.177:8080/h264_ulaw.sdp
        roles:
        - detect
        - record
        input_args: -rtsp_transport tcp -fflags +genpts+discardcorrupt -avoid_negative_ts
          make_zero
    detect:
      enabled: true
      width: 1280
      height: 720
      fps: 15
  cam_192_168_0_212:
    ffmpeg:
      inputs:
      - path: rtsp://192.168.0.212:8080/h264_ulaw.sdp
        roles:
        - detect
        - record
        input_args: -rtsp_transport tcp -fflags +genpts+discardcorrupt -avoid_negative_ts
          make_zero
    detect:
      enabled: true
      width: 1280
      height: 720
      fps: 15
version: 0.17-0
semantic_search:
  enabled: false
  model_size: small
face_recognition:
  enabled: true
  model_size: small
lpr:
  enabled: false
classification:
  bird:
    enabled: false
