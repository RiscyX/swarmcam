services:
  frigate:
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:stable
    restart: unless-stopped
    shm_size: 256mb
    volumes:
    - ./frigate/config.yml:/config/config.yml
    - frigate_db:/config
    - ./media:/media/frigate
    - /etc/localtime:/etc/localtime:ro
    ports:
    - 5000:5000
    - 1984:1984
    - 8554:8554
    - 8555:8555/tcp
    - 8555:8555/udp
    environment:
      FRIGATE_RTSP_PASSWORD: ''
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    depends_on:
    - mosquitto
    networks:
    - swarmcam
    runtime: nvidia
  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
    - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    - ./mosquitto/data:/mosquitto/data
    - ./mosquitto/log:/mosquitto/log
    ports:
    - 1883:1883
    - 9001:9001
    networks:
    - swarmcam
  backend:
    container_name: swarmcam-backend
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
    - 8000:8000
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - ./frigate/config.yml:/swarmcam/docker/frigate/config.yml
    - ./docker-compose.yml:/swarmcam/docker/docker-compose.yml:ro
    - ./media:/swarmcam/docker/media
    - ../backend/aliases.json:/swarmcam/backend/aliases.json
    environment:
      FRIGATE_URL: http://frigate:5000
      MQTT_HOST: mosquitto
    depends_on:
    - mosquitto
    networks:
    - swarmcam
  dashboard:
    container_name: swarmcam-dashboard
    build:
      context: ../frontend
    restart: unless-stopped
    ports:
    - 80:80
    depends_on:
    - backend
    networks:
    - swarmcam
volumes:
  frigate_db: null
networks:
  swarmcam:
    driver: bridge
