services:
  frigate:
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:stable-tensorrt
    restart: unless-stopped
    shm_size: 256mb
    volumes:
    - ./frigate/config.yml:/config/config.yml
    - frigate_db:/config
    - ./frigate/model_cache:/config/model_cache
    - ./media:/media/frigate
    - /etc/localtime:/etc/localtime:ro
    network_mode: host
    environment:
      FRIGATE_RTSP_PASSWORD: ''
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    depends_on:
    - mosquitto
    runtime: nvidia
  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
    - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    - ./mosquitto/data:/mosquitto/data
    - ./mosquitto/log:/mosquitto/log
    ports:
    - 1883:1883
    - 9001:9001
    networks:
    - swarmcam
  backend:
    container_name: swarmcam-backend
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    network_mode: host
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - ./frigate/config.yml:/swarmcam/docker/frigate/config.yml
    - ./docker-compose.yml:/swarmcam/docker/docker-compose.yml
    - ./media:/swarmcam/docker/media
    - ../backend/aliases.json:/swarmcam/backend/aliases.json
    - ../backend/fire_events.db:/swarmcam/backend/fire_events.db
    - ../backend/fire_snapshots:/swarmcam/backend/fire_snapshots
    environment:
      FRIGATE_URL: http://localhost:5000
      MQTT_HOST: localhost
      DEFAULT_USER: ${DEFAULT_USER}
      DEFAULT_PASSWORD: ${DEFAULT_PASSWORD}
    depends_on:
    - mosquitto
  dashboard:
    container_name: swarmcam-dashboard
    build:
      context: ../frontend
    restart: unless-stopped
    network_mode: host
    depends_on:
    - backend
  fire-detector:
    container_name: swarmcam-fire-detector
    build:
      context: ../fire-detector
    restart: unless-stopped
    network_mode: host
    volumes:
    - ../fire-detector/models:/app/models
    environment:
      MQTT_HOST: localhost
      BACKEND_URL: http://localhost:8000
      SCAN_INTERVAL: '5'
      CONFIDENCE: '0.8'
    depends_on:
    - backend
    - mosquitto
volumes:
  frigate_db: null
networks:
  swarmcam:
    driver: bridge
