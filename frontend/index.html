<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- a mobil státuszsáv a MobileHeader (bg-chrome) fölött ül, nem a bg-app fölött -->
    <meta name="theme-color" content="#111111" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📷</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>SwarmCam</title>
    <!-- FOUC-gát: az első festés ELŐTT bélyegzi meg a <html>-t, ezért szinkron
         és nem type="module" — a hooks/use-theme.tsx ezt olvassa vissza. -->
    <script>
      (function () {
        var theme = 'dark'
        try {
          if (localStorage.getItem('swarmcam.theme') === 'light') theme = 'light'
        } catch (e) {
          /* privát mód / letiltott sütik — marad a dark */
        }
        document.documentElement.setAttribute('data-theme', theme)
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', theme === 'light' ? '#f7f5f3' : '#111111')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
